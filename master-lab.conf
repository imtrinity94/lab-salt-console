# Lab Salt master settings (copied to /etc/salt/master.d/lab.conf on a master)
# The master runs as root so PAM external auth can check passwords.
user: root
auto_accept: False
file_roots:
  base:
    - /srv/salt
pillar_roots:
  base:
    - /srv/pillar
external_auth:
  pam:
    saltapi:
      - .*
      - '@wheel'
      - '@runner'
      - '@jobs'
netapi_enable_clients:
  - local
  - local_async
  - local_batch
  - local_subset
  - runner
  - runner_async
  - wheel
  - wheel_async
rest_cherrypy:
  host: 127.0.0.1
  port: 8000
  disable_ssl: True

# Keep job results for 30 days so the Highstate trend and Limit by views have history.
keep_jobs_seconds: 2592000
