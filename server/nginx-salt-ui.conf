# Lab Salt Console: static web root, salt-api and the console service behind one TLS listener.
# Installed to /etc/nginx/sites-available/salt-ui by tools/install-server.sh
server {
  listen 80 default_server;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl default_server;
  ssl_certificate /etc/ssl/certs/salt-ui.crt;
  ssl_certificate_key /etc/ssl/private/salt-ui.key;
  root /opt/salt-ui/www;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control no-cache;
  }
  location /salt-api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /console-api/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 4m;
  }
}
